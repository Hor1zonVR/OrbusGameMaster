name: GameMaster tests
on:
  push:
    branches: [main, feat/v0.2-dashboard]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/server.mjs
      - run: node --check src/engine.mjs
      - run: node --check public/app.js
